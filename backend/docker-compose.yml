services:
  influxdb:
    image: influxdb:2.7
    ports: ["${INFLUX_PORT:-8086}:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-change-me-before-demo}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-axon}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-change-me-before-demo}
    volumes: ["influx_data:/var/lib/influxdb2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16
    # Host-run FastAPI needs local access; this is intentionally not LAN-exposed.
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-demo}
      POSTGRES_DB: ${POSTGRES_DB:-axon}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  influx_data:
  postgres_data:
